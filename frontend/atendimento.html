<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Atendimento</h2>

    <!-- NOME -->
    <input
        id="nome"
        type="text"
        placeholder="Nome"
    >

    <!-- CPF -->
    <input
        id="cpf"
        type="text"
        placeholder="CPF"
    >

    <!-- DATA DE NASCIMENTO -->
    <input
        id="dataNascimento"
        type="date"
    >

    <!-- SEXO -->
    <select id="sexo">
        <option value="">Selecione o sexo</option>
        <option value="Feminino">Feminino</option>
        <option value="Masculino">Masculino</option>
        <option value="Outro">Outro</option>
    </select>

    <!-- NOME DO RESPONSÁVEL -->
    <input
        id="nomeResponsavel"
        type="text"
        placeholder="Nome do Responsável"
    >

    <!-- ESTADO CIVIL -->
    <select id="estadoCivil">
        <option value="">Selecione o estado civil</option>
        <option value="Solteiro(a)">Solteiro(a)</option>
        <option value="Casado(a)">Casado(a)</option>
        <option value="Divorciado(a)">Divorciado(a)</option>
        <option value="Viúvo(a)">Viúvo(a)</option>
        <option value="Separado(a)">Separado(a)</option>
    </select>

    <!-- ENDEREÇO -->
    <input
        id="endereco"
        type="text"
        placeholder="Endereço"
    >

    <!-- TELEFONE -->
    <input
        id="telefone"
        type="text"
        placeholder="Telefone"
    >

    <!-- EMAIL -->
    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <!-- CONTATO DE EMERGÊNCIA -->
    <input
        id="contatoEmergencia"
        type="text"
        placeholder="Contato de Emergência"
    >

    <!-- TIPO DE ATENDIMENTO -->
    <select id="tipo">
        <option value="">Selecione o tipo</option>
        <option value="Convenio">Convênio</option>
        <option value="Particular">Particular</option>
    </select>

    <!-- FOTO -->
    <input
        type="file"
        id="foto"
        accept="image/*"
    >

    <!-- BOTÃO -->
    <button onclick="cadastrar()">
        Cadastrar
    </button>

</div>


<script>

function cadastrar() {

    // Pegando os valores dos campos
    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const dataNascimento = document.getElementById("dataNascimento").value;
    const sexo = document.getElementById("sexo").value;
    const nomeResponsavel = document.getElementById("nomeResponsavel").value.trim();
    const estadoCivil = document.getElementById("estadoCivil").value;
    const endereco = document.getElementById("endereco").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const email = document.getElementById("email").value.trim();
    const contatoEmergencia = document.getElementById("contatoEmergencia").value.trim();
    const tipo = document.getElementById("tipo").value;

    // Pega a foto selecionada
    const fotoInput = document.getElementById("foto");
    const foto = fotoInput.files[0];


    // Verifica se os campos principais foram preenchidos
    if (!nome) {
        alert("Digite o nome do paciente.");
        return;
    }

    if (!cpf) {
        alert("Digite o CPF.");
        return;
    }

    if (!sexo) {
        alert("Selecione o sexo.");
        return;
    }

    if (!estadoCivil) {
        alert("Selecione o estado civil.");
        return;
    }

    if (!tipo) {
        alert("Selecione o tipo de atendimento.");
        return;
    }


    // Cria o formulário para enviar texto + foto
    const formData = new FormData();

    formData.append("nome", nome);
    formData.append("cpf", cpf);
    formData.append("dataNascimento", dataNascimento);
    formData.append("sexo", sexo);
    formData.append("nomeResponsavel", nomeResponsavel);
    formData.append("estadoCivil", estadoCivil);
    formData.append("endereco", endereco);
    formData.append("telefone", telefone);
    formData.append("email", email);
    formData.append("contatoEmergencia", contatoEmergencia);
    formData.append("tipo", tipo);

    // Só adiciona a foto se uma tiver sido selecionada
    if (foto) {
        formData.append("foto", foto);
    }


    // Envia os dados para o servidor
    fetch("/atendimento", {

        method: "POST",

        // IMPORTANTE:
        // Não colocar Content-Type aqui.
        // O navegador configura automaticamente o multipart/form-data
        // por causa do FormData.

        body: formData

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Erro ao cadastrar paciente.");
        }

        return response.json();

    })

    .then(data => {

        alert("Paciente enviado para triagem!");


        // Limpa o formulário
        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("dataNascimento").value = "";
        document.getElementById("sexo").value = "";
        document.getElementById("nomeResponsavel").value = "";
        document.getElementById("estadoCivil").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("email").value = "";
        document.getElementById("contatoEmergencia").value = "";
        document.getElementById("tipo").value = "";

        // Limpa também a foto
        document.getElementById("foto").value = "";

    })

    .catch(error => {

        console.error(error);

        alert("Erro ao cadastrar paciente.");

    });

}

</script>

</body>
</html>
