<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Atendimento</h2>

    <!-- NOME -->
    <input
        id="nome"
        type="text"
        placeholder="Nome"
    >

    <!-- CPF -->
    <input
        id="cpf"
        type="text"
        placeholder="CPF"
    >

    <!-- DATA DE NASCIMENTO -->
    <input
        id="dataNascimento"
        type="date"
    >

    <!-- SEXO -->
    <select id="sexo">
        <option value="">Selecione o sexo</option>
        <option value="Feminino">Feminino</option>
        <option value="Masculino">Masculino</option>
        <option value="Outro">Outro</option>
    </select>

    <!-- NOME DO RESPONSÁVEL -->
    <input
        id="nomeResponsavel"
        type="text"
        placeholder="Nome do Responsável"
    >

    <!-- ESTADO CIVIL -->
    <select id="estadoCivil">
        <option value="">Selecione o estado civil</option>
        <option value="Solteiro(a)">Solteiro(a)</option>
        <option value="Casado(a)">Casado(a)</option>
        <option value="Divorciado(a)">Divorciado(a)</option>
        <option value="Viúvo(a)">Viúvo(a)</option>
        <option value="Separado(a)">Separado(a)</option>
    </select>

    <!-- ENDEREÇO -->
    <input
        id="endereco"
        type="text"
        placeholder="Endereço"
    >

    <!-- TELEFONE -->
    <input
        id="telefone"
        type="text"
        placeholder="Telefone"
    >

    <!-- EMAIL -->
    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <!-- CONTATO DE EMERGÊNCIA -->
    <input
        id="contatoEmergencia"
        type="text"
        placeholder="Contato de Emergência"
    >

    <!-- TIPO DE ATENDIMENTO -->
    <select id="tipo">
        <option value="">Selecione o tipo</option>
        <option value="Convenio">Convênio</option>
        <option value="Particular">Particular</option>
    </select>

    <!-- FOTO -->
    <input
        type="file"
        id="foto"
        accept="image/*"
    >

    <!-- BOTÃO -->
    <button onclick="cadastrar()">
        Cadastrar
    </button>

</div>


<script>

function cadastrar() {

    // Pegando os valores dos campos
    const nome = document.getElementById("nome").value;
    const cpf = document.getElementById("cpf").value;
    const dataNascimento = document.getElementById("dataNascimento").value;
    const sexo = document.getElementById("sexo").value;
    const nomeResponsavel = document.getElementById("nomeResponsavel").value;
    const estadoCivil = document.getElementById("estadoCivil").value;
    const endereco = document.getElementById("endereco").value;
    const telefone = document.getElementById("telefone").value;
    const email = document.getElementById("email").value;
    const contatoEmergencia = document.getElementById("contatoEmergencia").value;
    const tipo = document.getElementById("tipo").value;


    // Verifica se os campos principais foram preenchidos
    if (!nome) {
        alert("Digite o nome do paciente.");
        return;
    }

    if (!cpf) {
        alert("Digite o CPF.");
        return;
    }

    if (!sexo) {
        alert("Selecione o sexo.");
        return;
    }

    if (!estadoCivil) {
        alert("Selecione o estado civil.");
        return;
    }

    if (!tipo) {
        alert("Selecione o tipo de atendimento.");
        return;
    }


    // Envia os dados para o servidor
    fetch("/atendimento", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            nome: nome,

            cpf: cpf,

            dataNascimento: dataNascimento,

            sexo: sexo,

            nomeResponsavel: nomeResponsavel,

            estadoCivil: estadoCivil,

            endereco: endereco,

            telefone: telefone,

            email: email,

            contatoEmergencia: contatoEmergencia,

            tipo: tipo

        })

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Erro ao cadastrar paciente.");
        }

        return response.json();

    })

    .then(data => {

        alert("Paciente enviado para triagem!");

        // Limpa o formulário
        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("dataNascimento").value = "";
        document.getElementById("sexo").value = "";
        document.getElementById("nomeResponsavel").value = "";
        document.getElementById("estadoCivil").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("email").value = "";
        document.getElementById("contatoEmergencia").value = "";
        document.getElementById("tipo").value = "";

    })

    .catch(error => {

        console.error(error);

        alert("Erro ao cadastrar paciente.");

    });

}

</script>

</body>
</html>
