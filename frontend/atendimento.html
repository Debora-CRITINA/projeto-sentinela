<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Atendimento</h2>

    <!-- NOME -->
    <input
        id="nome"
        type="text"
        placeholder="Nome"
    >

    <!-- CPF -->
    <input
        id="cpf"
        type="text"
        placeholder="CPF"
    >

    <!-- DATA DE NASCIMENTO -->
    <input
        id="dataNascimento"
        type="date"
    >

    <!-- SEXO -->
    <select id="sexo">
        <option value="">Selecione o sexo</option>
        <option value="Feminino">Feminino</option>
        <option value="Masculino">Masculino</option>
        <option value="Outro">Outro</option>
    </select>

    <!-- NOME DO RESPONSÁVEL -->
    <input
        id="nomeResponsavel"
        type="text"
        placeholder="Nome do Responsável"
    >

    <!-- ESTADO CIVIL -->
    <select id="estadoCivil">
        <option value="">Selecione o estado civil</option>
        <option value="Solteiro(a)">Solteiro(a)</option>
        <option value="Casado(a)">Casado(a)</option>
        <option value="Divorciado(a)">Divorciado(a)</option>
        <option value="Viúvo(a)">Viúvo(a)</option>
        <option value="Separado(a)">Separado(a)</option>
    </select>

    <!-- ENDEREÇO -->
    <input
        id="endereco"
        type="text"
        placeholder="Endereço"
    >

    <!-- TELEFONE -->
    <input
        id="telefone"
        type="text"
        placeholder="Telefone"
    >

    <!-- EMAIL -->
    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <!-- CONTATO DE EMERGÊNCIA -->
    <input
        id="contatoEmergencia"
        type="text"
        placeholder="Contato de Emergência"
    >

    <!-- TIPO DE ATENDIMENTO -->
    <select id="tipo">
        <option value="">Selecione o tipo</option>
        <option value="Convenio">Convênio</option>
        <option value="Particular">Particular</option>
    </select>

    <!-- FOTO -->
    <input
        type="file"
        id="foto"
        accept="image/*"
    >

    <!-- BOTÃO -->
    <button type="button" onclick="cadastrar()">
        Cadastrar
    </button>

</div>


<script>

async function cadastrar() {

    // Pega os valores dos campos
    const dados = {
        nome: document.getElementById("nome").value.trim(),
        cpf: document.getElementById("cpf").value.trim(),
        dataNascimento: document.getElementById("dataNascimento").value,
        sexo: document.getElementById("sexo").value,
        nomeResponsavel: document.getElementById("nomeResponsavel").value.trim(),
        estadoCivil: document.getElementById("estadoCivil").value,
        endereco: document.getElementById("endereco").value.trim(),
        telefone: document.getElementById("telefone").value.trim(),
        email: document.getElementById("email").value.trim(),
        contatoEmergencia: document.getElementById("contatoEmergencia").value.trim(),
        tipo: document.getElementById("tipo").value
    };


    // Validações
    if (!dados.nome) {
        alert("Digite o nome do paciente.");
        return;
    }

    if (!dados.cpf) {
        alert("Digite o CPF.");
        return;
    }

    if (!dados.sexo) {
        alert("Selecione o sexo.");
        return;
    }

    if (!dados.estadoCivil) {
        alert("Selecione o estado civil.");
        return;
    }

    if (!dados.tipo) {
        alert("Selecione o tipo de atendimento.");
        return;
    }


    try {

        // Envia os dados para o servidor
        const resposta = await fetch("/atendimento", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(dados)

        });


        // Tenta ler a resposta do servidor
        const resultado = await resposta.json();


        // Se o servidor retornar erro
        if (!resposta.ok) {
            throw new Error(
                resultado.erro || "Erro ao cadastrar paciente."
            );
        }


        console.log("Paciente salvo:", resultado);

        alert("Paciente cadastrado com sucesso!");


        // Limpa os campos
        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("dataNascimento").value = "";
        document.getElementById("sexo").value = "";
        document.getElementById("nomeResponsavel").value = "";
        document.getElementById("estadoCivil").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("email").value = "";
        document.getElementById("contatoEmergencia").value = "";
        document.getElementById("tipo").value = "";
        document.getElementById("foto").value = "";


    } catch (erro) {

        console.error("Erro ao cadastrar:", erro);

        alert("Erro ao cadastrar paciente: " + erro.message);

    }

}

</script>

</body>
</html>
