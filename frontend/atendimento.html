<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">

<style>
/* =========================================================
   SISTEMA HOSPITALAR PREMIUM — ATENDIMENTO
   ========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px 15px;

  font-family: "Segoe UI", Arial, Helvetica, sans-serif;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(0, 188, 212, .12),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(25, 118, 210, .12),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #061421 0%,
      #0b2033 50%,
      #071521 100%
    );

  color: #243746;
}

/* =========================================================
   CARD
   ========================================================= */

.container {
  position: relative;

  width: 430px;
  max-width: 100%;

  padding: 42px 40px;

  background: rgba(255, 255, 255, .97);

  border: 1px solid rgba(255, 255, 255, .85);

  border-radius: 22px;

  box-shadow:
    0 30px 75px rgba(0, 0, 0, .35),
    0 10px 30px rgba(0, 0, 0, .12);

  animation: entrada .55s ease-out;
}

/* Detalhe superior */
.container::before {
  content: "";

  position: absolute;

  top: 0;
  left: 50%;

  transform: translateX(-50%);

  width: 110px;
  height: 4px;

  background: linear-gradient(
    90deg,
    #00acc1,
    #26c6da,
    #1976d2
  );

  border-radius: 0 0 10px 10px;
}

/* =========================================================
   TÍTULO
   ========================================================= */

.container h2 {
  margin: 0 0 32px;

  color: #102a43;

  font-size: 26px;
  font-weight: 700;

  letter-spacing: -.5px;

  text-align: center;
}

/* Pequeno detalhe abaixo do título */
.container h2::after {
  content: "Identificação do paciente";

  display: block;

  margin-top: 7px;

  color: #8295a3;

  font-size: 12px;
  font-weight: 500;

  letter-spacing: .3px;
}

/* =========================================================
   CAMPOS
   ========================================================= */

.container input,
.container select {
  width: 100%;
  height: 54px;

  display: block;

  margin-bottom: 16px;

  padding: 0 16px;

  background: #f7fafc;

  border: 1px solid #d7e2e8;

  border-radius: 11px;

  color: #18384d;

  font-family: inherit;
  font-size: 14px;

  outline: none;

  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    background .25s ease,
    transform .2s ease;
}

/* Placeholder */
.container input::placeholder {
  color: #8b9da8;
}

/* Hover */
.container input:hover,
.container select:hover {
  background: #ffffff;

  border-color: #b9ccd6;
}

/* Focus */
.container input:focus,
.container select:focus {
  background: #ffffff;

  border-color: #12a3bd;

  box-shadow:
    0 0 0 4px rgba(18, 163, 189, .09),
    0 5px 14px rgba(18, 163, 189, .06);

  transform: translateY(-1px);
}

/* =========================================================
   SELECT
   ========================================================= */

.container select {
  cursor: pointer;

  appearance: none;

  background-image:
    linear-gradient(45deg, transparent 50%, #55717f 50%),
    linear-gradient(135deg, #55717f 50%, transparent 50%);

  background-position:
    calc(100% - 19px) 23px,
    calc(100% - 13px) 23px;

  background-size:
    6px 6px,
    6px 6px;

  background-repeat: no-repeat;
}

.container select:focus {
  background-color: #ffffff;
}

/* =========================================================
   CAMPO DE ARQUIVO / FOTO
   ========================================================= */

.container input[type="file"] {
  height: auto;

  min-height: 58px;

  padding: 8px 10px;

  cursor: pointer;

  color: #617783;

  background: #f7fafc;
}

.container input[type="file"]::file-selector-button {
  margin-right: 12px;

  padding: 10px 15px;

  border: none;

  border-radius: 8px;

  background:
    linear-gradient(
      135deg,
      #e5f5f8,
      #dceff5
    );

  color: #087f9c;

  font-family: inherit;

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  transition: all .2s ease;
}

.container input[type="file"]::file-selector-button:hover {
  background: #ccebf1;

  color: #076f89;
}

/* =========================================================
   BOTÃO CADASTRAR
   ========================================================= */

.container button {
  width: 100%;
  height: 55px;

  margin-top: 8px;

  border: none;

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      #087f9c 0%,
      #0797b5 50%,
      #176fc1 100%
    );

  color: #ffffff;

  font-family: inherit;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: .2px;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(8, 127, 156, .24);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.container button:hover {
  transform: translateY(-2px);

  filter: brightness(1.08);

  box-shadow:
    0 14px 30px rgba(8, 127, 156, .34);
}

.container button:active {
  transform: translateY(0);

  box-shadow:
    0 6px 15px rgba(8, 127, 156, .22);
}

/* =========================================================
   ANIMAÇÃO
   ========================================================= */

@keyframes entrada {
  from {
    opacity: 0;

    transform:
      translateY(20px)
      scale(.98);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}

/* =========================================================
   RESPONSIVO
   ========================================================= */

@media (max-width: 500px) {

  body {
    padding: 20px 12px;
  }

  .container {
    width: 100%;

    padding: 35px 25px;

    border-radius: 18px;
  }

  .container h2 {
    font-size: 23px;

    margin-bottom: 27px;
  }

  .container input,
  .container select {
    height: 52px;
  }

  .container input[type="file"] {
    height: auto;
  }
}
</style>

</head>

<body>

<div class="container">

<h2>Atendimento</h2>

<!-- =========================================================
     IDENTIFICAÇÃO DO PACIENTE
     ========================================================= -->

<input
  id="nome"
  type="text"
  placeholder="Nome completo"
>

<input
  id="cpf"
  type="text"
  placeholder="CPF ou RG"
>

<input
  id="dataNascimento"
  type="date"
  title="Data de nascimento"
>

<select id="sexo">
  <option value="">Sexo</option>
  <option value="Feminino">Feminino</option>
  <option value="Masculino">Masculino</option>
  <option value="Outro">Outro</option>
  <option value="Nao informado">Não informado</option>
</select>

<input
  id="nomeMae"
  type="text"
  placeholder="Nome da mãe"
>

<select id="estadoCivil">
  <option value="">Estado civil</option>
  <option value="Solteiro">Solteiro(a)</option>
  <option value="Casado">Casado(a)</option>
  <option value="Divorciado">Divorciado(a)</option>
  <option value="Viuvo">Viúvo(a)</option>
  <option value="Uniao estavel">União estável</option>
  <option value="Outro">Outro</option>
</select>

<input
  id="endereco"
  type="text"
  placeholder="Endereço"
>

<input
  id="telefone"
  type="tel"
  placeholder="Telefone"
>

<input
  id="email"
  type="email"
  placeholder="E-mail"
>

<input
  id="contatoEmergencia"
  type="text"
  placeholder="Contato de emergência"
>

<select id="tipo">
  <option value="Convenio">Convênio</option>
  <option value="Particular">Particular</option>
</select>

<input
  type="file"
  id="foto"
  accept="image/*"
>

<button onclick="cadastrar()">Cadastrar</button>

</div>

<script>

function cadastrar(){

  fetch("http://localhost:3000/atendimento",{
    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body: JSON.stringify({

      nome: document.getElementById("nome").value,

      cpf: document.getElementById("cpf").value,

      dataNascimento:
        document.getElementById("dataNascimento").value,

      sexo:
        document.getElementById("sexo").value,

      nomeMae:
        document.getElementById("nomeMae").value,

      estadoCivil:
        document.getElementById("estadoCivil").value,

      endereco:
        document.getElementById("endereco").value,

      telefone:
        document.getElementById("telefone").value,

      email:
        document.getElementById("email").value,

      contatoEmergencia:
        document.getElementById("contatoEmergencia").value,

      tipo:
        document.getElementById("tipo").value

    })
  });

  alert("Paciente enviado para triagem");
}

</script>

</body>
</html>
